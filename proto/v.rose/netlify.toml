# L'application est en React : il faut la compiler.
# Netlify lance npm install tout seul quand il voit package.json,
# puis execute cette commande, qui produit bundle.js a la racine.
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA : toutes les routes retombent sur index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Les polices ne changent jamais : cache long.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
